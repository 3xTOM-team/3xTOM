<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эх ТОМ клуб</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@500;600;700;800&family=Noto+Serif:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #1c084a;
      background:
        linear-gradient(rgba(154, 154, 154, 0.23) 1px, transparent 1px),
        linear-gradient(90deg, rgba(154, 154, 154, 0.23) 1px, transparent 1px),
        radial-gradient(circle at 10% 92%, rgba(199, 255, 221, 0.9), transparent 34%),
        radial-gradient(circle at 85% 8%, rgba(255, 210, 229, 0.95), transparent 45%),
        linear-gradient(110deg, #f7fdff 0%, #fff0fa 53%, #fff8ee 100%);
      background-size: 24px 24px, 24px 24px, auto, auto, auto;
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      width: 1024px;
      height: 489px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      background:
        linear-gradient(rgba(154, 154, 154, 0.23) 1px, transparent 1px),
        linear-gradient(90deg, rgba(154, 154, 154, 0.23) 1px, transparent 1px),
        radial-gradient(circle at 6% 88%, rgba(199, 255, 221, 0.88), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(255, 210, 229, 0.92), transparent 44%),
        linear-gradient(110deg, #f7fdff 0%, #fff1fb 54%, #fff8ef 100%);
      background-size: 24px 24px, 24px 24px, auto, auto, auto;
      border: 4px solid #333;
      border-bottom: 0;
    }

    .navbar {
      position: absolute;
      top: 10px;
      left: 99px;
      width: 820px;
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border: 1.5px solid #ff5a9d;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 12px rgba(255, 61, 139, 0.35);
      z-index: 10;
    }

    .logo {
      width: 54px;
      height: 44px;
      margin-right: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .logo:hover {
      transform: rotate(-6deg) scale(1.08);
    }

    .star-logo {
      width: 39px;
      height: 39px;
      position: relative;
      background: #ffcf3d;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 0 0 #ff7db2);
    }

    .star-logo::before,
    .star-logo::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #ff7ab5;
    }

    .star-logo::before {
      width: 7px;
      height: 7px;
      right: -5px;
      top: 14px;
      box-shadow: -28px -10px 0 #77d8ff, -9px -17px 0 #ff9fc6, -18px 28px 0 #8ddd8d;
    }

    .star-logo::after {
      content: "Эх\A TOM";
      white-space: pre;
      left: 10px;
      top: 12px;
      width: 19px;
      height: 15px;
      border-radius: 9px;
      background: #ff66a0;
      color: white;
      font-size: 5px;
      line-height: 6px;
      text-align: center;
      font-weight: 800;
      padding-top: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 39px;
      list-style: none;
      font-size: 9px;
      font-weight: 800;
    }

    .nav-links a {
      position: relative;
      color: #080008;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ff5a9d;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 0;
      height: 2px;
      border-radius: 99px;
      background: #ff5a9d;
      transform: translateX(-50%);
      transition: width 0.22s ease;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 30px;
    }

    .nav-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .btn {
      border: 1.5px solid #ff4f96;
      border-radius: 22px;
      padding: 10px 21px;
      font-size: 10px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(255, 77, 150, 0.3);
    }

    .btn-primary {
      background: #ff5a9d;
      color: #fff;
      box-shadow: 0 4px 9px rgba(255, 77, 150, 0.28);
    }

    .btn-primary:hover {
      background: #ff3d8c;
    }

    .btn-outline {
      background: #fff;
      color: #ff5a9d;
    }

    .btn-outline:hover {
      background: #fff1f7;
      color: #ff2b82;
    }

    .hero {
      position: absolute;
      left: 99px;
      top: 125px;
      width: 530px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 9px;
      border: 1px solid #ff5a9d;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.45);
      color: #ff5a9d;
      font-size: 11px;
      font-weight: 700;
      margin-left: 3px;
      margin-bottom: 25px;
    }

    h1 {
      width: 500px;
      font-family: 'Baloo 2', Inter, sans-serif;
      font-size: 38px;
      line-height: 0.93;
      letter-spacing: -1px;
      font-weight: 800;
      color: #17034b;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .pink {
      color: #ff65a3;
    }

    .heart {
      position: relative;
      display: inline-block;
    }

    .heart::after {
      content: "❤";
      position: absolute;
      top: -15px;
      right: -11px;
      color: #ff65a3;
      font-size: 13px;
      transform: rotate(12deg);
    }

    .subtitle {
      margin-top: 10px;
      font-family: 'Noto Serif', Georgia, serif;
      color: #384241;
      font-size: 16px;
      line-height: 1.3;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 21px;
    }

    .hero-actions .btn {
      height: 35px;
      padding: 0 17px;
      font-size: 10px;
    }

    .scroll-dot {
      position: absolute;
      right: 48px;
      bottom: -23px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ff5a9d;
      box-shadow: 0 8px 18px rgba(255, 90, 157, 0.35);
    }

    .scroll-dot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 12px;
      width: 9px;
      height: 9px;
      border-right: 2px solid white;
      border-bottom: 2px solid white;
      transform: translateX(-50%) rotate(45deg);
    }

    @media (max-width: 1024px) {
      .page {
        width: 100vw;
        min-width: 360px;
      }

      .navbar {
        left: 50%;
        transform: translateX(-50%);
        width: min(820px, calc(100vw - 56px));
      }
    }

    @media (max-width: 760px) {
      .page {
        height: 620px;
      }

      .navbar {
        height: auto;
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 24px;
      }

      .logo {
        margin-right: 10px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .nav-links a::after {
        bottom: -6px;
      }

      .hero {
        left: 28px;
        top: 175px;
        width: calc(100% - 56px);
      }

      h1 {
        width: 100%;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="navbar">
      <a class="logo" href="#" aria-label="Эх ТОМ клуб">
        <span class="star-logo"></span>
      </a>

      <ul class="nav-links">
        <li><a class="active" href="#">Нүүр</a></li>
        <li><a href="#">Танилцуулга</a></li>
        <li><a href="#">Мэдээлэл</a></li>
        <li><a href="#">Постер</a></li>
        <li><a href="#">Бичлэг</a></li>
        <li><a href="#">Холбогдох</a></li>
      </ul>

      <div class="nav-actions">
        <a class="btn btn-primary" href="#">Хандив өгөх</a>
        <a class="btn btn-outline" href="#">Нэвтрэх</a>
      </div>
    </nav>

    <section class="hero">
      <div class="badge">Бүх хүнд нээлттэй</div>
      <h1>
        <span>"</span><span class="pink">ЭхТОМ</span><span>" клуб нь</span><br>
        <span>тусгай хэрэгцээт</span><br>
        <span>хүмүүсийн </span><span class="pink">хөгжил</span><span>,</span><br>
        <span>нийгмийн оролцоог</span><br>
        <span>дэмжих </span><span class="pink heart">орон зай</span><span> юм.</span>
      </h1>
      <p class="subtitle">Хамтдаа илүү тод гэрэлтье.</p>
      <div class="hero-actions">
        <a class="btn btn-outline" href="#">Дэлгэрэнгүй ↗</a>
        <a class="btn btn-primary" href="#">Хандив өгөх</a>
      </div>
    </section>

    <div class="scroll-dot"></div>
  </main>
</body>
</html>
