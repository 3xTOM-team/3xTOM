      }

      .comic-relief-bold {
        font-family: "Comic Relief", system-ui;
        font-weight: 700;
        font-style: normal;
      }

      .page-bg {
        background:
          radial-gradient(
            circle at 10% 14%,
            rgba(218, 247, 230, 0.86),
            transparent 31%
          ),

            circle at 92% 12%,
            rgba(255, 220, 238, 0.9),
            transparent 35%
          ),
          radial-gradient(

            rgba(255, 239, 180, 0.64),
            transparent 33%

            rgba(218, 225, 255, 0.78),
            transparent 35%
          ),
          linear-gradient(135deg, #fdffff 0%, #fff3fa 48%, #f3fff8 100%);
      }

      .grid-bg {
        background:
          linear-gradient(
            to right,
            rgba(55, 65, 81, 0.13) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(55, 65, 81, 0.13) 1px,
            transparent 1px
          ),
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.85),
            rgba(255, 246, 252, 0.85)
          );
        background-size:
          28px 28px,
          28px 28px,
          cover;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 24px 70px rgba(255, 102, 162, 0.18);
        backdrop-filter: blur(16px);
      }

      .admin-shadow {
        box-shadow: 0 18px 45px rgba(25, 0, 78, 0.08);
      }

      .thin-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .thin-scrollbar::-webkit-scrollbar-track {
        background: #fff0f7;
        border-radius: 999px;
      }

      .thin-scrollbar::-webkit-scrollbar-thumb {
        background: #ff9bc4;
        border-radius: 999px;
      }

      .svg-icon {
        display: inline-block;
        flex-shrink: 0;
      }

      .tap-target {
        touch-action: manipulation;
      }

      @media (max-width: 767px) {
        .admin-shadow {
          box-shadow: 0 12px 28px rgba(25, 0, 78, 0.08);
        }
      }

      function getStore() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = defaultData();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
          return fresh;
        }
        try {
          const base = defaultData();
          const parsed = JSON.parse(raw);
          const merged = {
            ...base,
            ...parsed,
            settings: { ...base.settings, ...(parsed.settings || {}) },
          };

          if (merged.settings.adminEmail === "@3xtom.mn") {
            merged.settings.adminEmail = "admin@3xtom.mn";
          }
          if (merged.settings.adminPassword === "3xTOM2026") {
            merged.settings.adminPassword = "3xtom2026";
          }

          return merged;
        } catch (error) {
          const fresh = defaultData();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
          return fresh;
        }
      }

      function saveStore(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function toast(message) {
        const el = document.getElementById("toast");
        el.textContent = message;
        el.classList.remove("hidden");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(
          () => el.classList.add("hidden"),
          2200,
        );
      }

      function isAuthed() {
        return sessionStorage.getItem(AUTH_KEY) === "true";
      }

      function renderApp() {
        const app = document.getElementById("app");
        const logoutBtn = document.getElementById("logoutBtn");
        if (!isAuthed()) {
          app.innerHTML = document.getElementById("loginTemplate").innerHTML;
          logoutBtn.classList.add("hidden");
          bindLogin();
          return;
        }
        app.innerHTML = document.getElementById("dashboardTemplate").innerHTML;
        logoutBtn.classList.remove("hidden");
        renderSideNav();
        bindDashboardActions();
        renderPanel();
      }

      function bindLogin() {
        const fillDemoBtn = document.getElementById("fillDemoBtn");
        if (fillDemoBtn) {
          fillDemoBtn.addEventListener("click", () => {
            const data = getStore();
            document.getElementById("adminEmail").value =
              data.settings.adminEmail;
            document.getElementById("adminPassword").value =
              data.settings.adminPassword;
          });
        }

        document
          .getElementById("loginForm")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            const data = getStore();
            const email = document.getElementById("adminEmail").value.trim();
            const password = document
              .getElementById("adminPassword")
              .value.trim();
            if (
              email === data.settings.adminEmail &&
              password === data.settings.adminPassword
            ) {
              sessionStorage.setItem(AUTH_KEY, "true");
              toast("Амжилттай нэвтэрлээ");
              renderApp();
            } else {
              toast("Имэйл эсвэл нууц үг буруу байна");
            }
          });
      }

      document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem(AUTH_KEY);
        toast("Системээс гарлаа");
        renderApp();
      });

      function badgeClass(status) {
        const value = String(status || "").toLowerCase();
        if (["published", "approved", "answered"].includes(value))
          return "bg-[#E9FFF0] text-[#149447]";
        if (["draft", "new"].includes(value))
          return "bg-[#FFF7DB] text-[#C47A00]";
        if (["hidden", "closed", "archived"].includes(value))
          return "bg-[#F3F4F6] text-slate-500";
        return "bg-[#FFF2F8] text-[#FF66A2]";
      }

      function getPrimary(item, tab) {
        if (tab === "pages") return item.menu || item.page || "Untitled";
        if (tab === "donations") return item.donor || "Anonymous";
        if (tab === "messages") return item.name || item.email || "Message";
        return item.title || item.name || "Untitled";
      }

      function getSecondary(item, tab) {
        if (tab === "pages") return item.title || item.description || "";
        if (tab === "programs")
          return item.category + " · " + (item.description || "");
        if (tab === "posts") return item.excerpt || item.content || "";
        if (tab === "posters") return item.description || "";
        if (tab === "videos")
          return (
            (item.episode ? item.episode + " · " : "") +
            (item.description || "")
          );
        if (tab === "donations")
          return `${Number(item.amount || 0).toLocaleString("mn-MN")}₮ · ${item.type || ""} · ${item.message || ""}`;
        if (tab === "messages")
          return `${item.subject || ""} · ${item.message || ""}`;
        return "";
      }

      function getImage(item) {
        return item.image || item.thumbnail || "";

      function blankRecord(tab) {
        const item = { id: uid() };
        schemas[tab].forEach((field) => {
          if (field.type === "date") item[field.key] = today();
          else if (field.type === "number") item[field.key] = 0;
          else if (field.type === "select") item[field.key] = field.options[0];
          else item[field.key] = "";
        });
        return item;
      }

      function filteredRecords(tab) {
        const data = getStore();
        let rows = data[tab] || [];
        if (statusFilter !== "all")
          rows = rows.filter((item) => String(item.status) === statusFilter);
        const q = searchQuery.trim().toLowerCase();
        if (q) {
          rows = rows.filter((item) =>
            Object.values(item).join(" ").toLowerCase().includes(q),
          );
        }
        return rows;
      }

                                  ${
                                    img
                                      ? `<img src="${escapeHtml(img)}" onerror="this.onerror=null;this.src='${escapeHtml(imageFallback(img))}';" alt="" class="h-full w-full object-cover" />`
                                      : `<div class="grid h-full w-full place-items-center text-[#FF66A2]">${svgIcon(sections.find((s) => s.key === tab)?.icon || "dashboard", "h-7 w-7")}</div>`
                                  }
                                </div>
                                <div class="min-w-0 flex-1">
                                  <div class="mb-2 flex flex-wrap items-center gap-2">
                                    <h3 class="truncate text-lg font-black text-[#19004E]">${escapeHtml(getPrimary(item, tab))}</h3>
                                    ${item.status ? `<span class="rounded-full px-3 py-1 text-[11px] font-black ${badgeClass(item.status)}">${escapeHtml(item.status)}</span>` : ""}
                                  </div>
                                  <p class="line-clamp-2 text-sm font-semibold leading-5 text-slate-600">${escapeHtml(getSecondary(item, tab))}</p>
                                </div>
                                <div class="flex shrink-0 gap-2">
                                  <button data-edit="${item.id}" class="edit-btn rounded-full border-2 border-[#FF66A2] px-4 py-2 text-xs font-black text-[#FF66A2] hover:bg-pink-50">Edit</button>
                                  <button data-delete="${item.id}" class="delete-btn rounded-full border-2 border-[#19004E] px-4 py-2 text-xs font-black text-[#19004E] hover:bg-[#19004E] hover:text-white">Delete</button>
                                </div>
                              </div>
                            </article>
                          `;
                        })
                        .join("")
                    : `<div class="rounded-[24px] border border-dashed border-[#FF66A2] bg-[#FFF2F8] p-8 text-center font-black text-[#FF66A2]">Item олдсонгүй</div>`
                }
              </div>
            </div>

            <div class="h-fit rounded-[30px] border border-white/80 bg-white/82 p-5 shadow-[0_18px_45px_rgba(25,0,78,0.07)] backdrop-blur xl:sticky xl:top-28">
              <div class="mb-5 flex items-center justify-between">
                <div>
                  <p class="text-xs font-extrabold tracking-[3px] text-[#FF66A2]">EDITOR</p>
                  <h2 class="mt-1 text-2xl font-black">${editingId ? "Засах" : "Шинээр нэмэх"}</h2>
                </div>
                ${editingId ? `<button id="cancelEditBtn" class="rounded-full bg-[#FFF2F8] px-4 py-2 text-xs font-black text-[#FF66A2]">Cancel</button>` : ""}
              </div>
              <form id="editorForm" class="space-y-4">
                ${renderFields(tab, current)}
                <button class="h-12 w-full rounded-full bg-[#FF66A2] text-sm font-black text-white shadow-lg shadow-pink-200 transition hover:bg-pink-600" type="submit">${editingId ? "Өөрчлөлт хадгалах" : "Нэмэх"}</button>
              </form>
            </div>
          </div>
        `;

        document
          .getElementById("searchInput")
          .addEventListener("input", (event) => {
            searchQuery = event.target.value;
            rerenderCrudWithSearchFocus(tab);
          });
        document
          .getElementById("statusFilter")
          .addEventListener("change", (event) => {
            statusFilter = event.target.value;
            renderCrud(tab);
          });
        document.getElementById("newItemBtn").addEventListener("click", () => {
          editingId = null;
          renderCrud(tab);
        });
        document.querySelectorAll(".edit-btn").forEach((button) => {
          button.addEventListener("click", () => {
            editingId = button.dataset.edit;
            renderCrud(tab);
          });
        });
        document.querySelectorAll(".delete-btn").forEach((button) => {
          button.addEventListener("click", () =>
            deleteRecord(tab, button.dataset.delete),
          );
        });
        const cancelBtn = document.getElementById("cancelEditBtn");
        if (cancelBtn)
          cancelBtn.addEventListener("click", () => {
            editingId = null;
            renderCrud(tab);
          });
        document
          .getElementById("editorForm")
          .addEventListener("submit", (event) => saveRecord(event, tab));
      }

      function renderFields(tab, current) {
        return schemas[tab]
          .map((field) => {
            const value = current[field.key] ?? "";
            if (field.type === "textarea") {
              return `
                <label class="block">
                  <span class="mb-2 block text-sm font-black">${field.label}</span>
                  <textarea data-field="${field.key}" rows="4" class="w-full rounded-[20px] border border-pink-100 bg-white px-4 py-3 text-sm font-bold outline-none focus:border-[#FF66A2] focus:ring-4 focus:ring-pink-100">${escapeHtml(value)}</textarea>
                </label>
              `;
            }
            if (field.type === "select") {
              return `
                <label class="block">
                  <span class="mb-2 block text-sm font-black">${field.label}</span>
                  <select data-field="${field.key}" class="h-12 w-full rounded-full border border-pink-100 bg-white px-4 text-sm font-bold outline-none focus:border-[#FF66A2] focus:ring-4 focus:ring-pink-100">
                    ${field.options.map((option) => `<option value="${escapeHtml(option)}" ${String(value) === String(option) ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
                  </select>
                </label>
              `;
            }
            return `
              <label class="block">
                <span class="mb-2 block text-sm font-black">${field.label}</span>
                <input data-field="${field.key}" type="${field.type || "text"}" value="${escapeHtml(value)}" class="h-12 w-full rounded-full border border-pink-100 bg-white px-4 text-sm font-bold outline-none focus:border-[#FF66A2] focus:ring-4 focus:ring-pink-100" />
              </label>
            `;
          })
          .join("");
      }

      function saveRecord(event, tab) {
        event.preventDefault();
        const data = getStore();
        const item = editingId
          ? { ...data[tab].find((record) => record.id === editingId) }
          : { id: uid() };
        schemas[tab].forEach((field) => {
          const input = document.querySelector(`[data-field="${field.key}"]`);
          item[field.key] =
            field.type === "number"
              ? Number(input.value || 0)
              : input.value.trim();
        });
        if (editingId) {
          data[tab] = data[tab].map((record) =>
            record.id === editingId ? item : record,
          );
          toast("Амжилттай засагдлаа");
        } else {
          data[tab].unshift(item);
          toast("Шинэ item нэмэгдлээ");
        }
        saveStore(data);
        editingId = null;
        renderCrud(tab);
      }

      function deleteRecord(tab, id) {
        if (!confirm("Энэ item-ийг устгах уу?")) return;
        const data = getStore();
        data[tab] = data[tab].filter((item) => item.id !== id);
        saveStore(data);
        if (editingId === id) editingId = null;
        toast("Устгалаа");
        renderCrud(tab);
      }

      function renderSettings() {
        const data = getStore();
        document.getElementById("mainPanel").innerHTML = `
          <div class="grid gap-6 xl:grid-cols-[1fr_0.82fr]">
            <div class="rounded-[30px] border border-white/80 bg-white/80 p-6 shadow-[0_18px_45px_rgba(25,0,78,0.07)]">
              <p class="text-xs font-extrabold tracking-[3px] text-[#FF66A2]">SITE SETTINGS</p>
              <h2 class="mt-1 text-2xl font-black">Ерөнхий тохиргоо</h2>
              <form id="settingsForm" class="mt-6 grid gap-4 md:grid-cols-2">
                ${schemas.settings
                  .map((field) => {
                    const value = data.settings[field.key] ?? "";
                    if (field.type === "textarea") {
                      return `
                        <label class="block md:col-span-2">
                          <span class="mb-2 block text-sm font-black">${field.label}</span>
                          <textarea data-setting="${field.key}" rows="4" class="w-full rounded-[20px] border border-pink-100 bg-white px-4 py-3 text-sm font-bold outline-none focus:border-[#FF66A2] focus:ring-4 focus:ring-pink-100">${escapeHtml(value)}</textarea>
                        </label>
                      `;
                    }
                    return `
                      <label class="block ${field.key === "slogan" ? "md:col-span-2" : ""}">
                        <span class="mb-2 block text-sm font-black">${field.label}</span>
                        <input data-setting="${field.key}" type="${field.key === "adminPassword" ? "password" : "text"}" value="${escapeHtml(value)}" class="h-12 w-full rounded-full border border-pink-100 bg-white px-4 text-sm font-bold outline-none focus:border-[#FF66A2] focus:ring-4 focus:ring-pink-100" />
                      </label>
                    `;
                  })
                  .join("")}
                <button class="h-12 rounded-full bg-[#FF66A2] text-sm font-black text-white shadow-lg shadow-pink-200 transition hover:bg-pink-600 md:col-span-2" type="submit">Тохиргоо хадгалах</button>
              </form>
            </div>

            <div class="grid-bg rounded-[30px] border border-white/80 p-6 shadow-[0_18px_45px_rgba(25,0,78,0.07)]">
              <p class="text-xs font-extrabold tracking-[3px] text-[#FF66A2]">DATA CONNECT</p>
              <h2 class="mt-1 text-2xl font-black">Public page дээр гаргах</h2>
              <p class="mt-4 text-sm font-bold leading-6 text-slate-700">
                Энэ admin.html одоогоор browser localStorage дээр хадгалж байна. Main/news/poster/videos хуудсуудын content-ийг шууд admin-аас уншуулмаар бол тухайн хуудсанд render script нэмэх эсвэл backend database холбоно.
              </p>
              <div class="mt-5 rounded-[22px] bg-white/80 p-4">
                <p class="mb-2 text-sm font-black text-[#19004E]">localStorage key:</p>
                <code class="break-all rounded-xl bg-[#FFF2F8] px-3 py-2 text-xs font-black text-[#FF66A2]">${STORAGE_KEY}</code>
              </div>
              <button id="copyKeyBtn" class="mt-5 h-12 w-full rounded-full border-2 border-[#FF66A2] bg-white text-sm font-black text-[#FF66A2] hover:bg-pink-50">Key copy</button>
            </div>
          </div>
        `;

        document
          .getElementById("settingsForm")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            const fresh = getStore();
            document.querySelectorAll("[data-setting]").forEach((input) => {
              fresh.settings[input.dataset.setting] = input.value.trim();
            });
            saveStore(fresh);
            toast("Тохиргоо хадгалагдлаа");
          });
        document
          .getElementById("copyKeyBtn")
          .addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(STORAGE_KEY);
              toast("Key copy хийгдлээ");
            } catch (error) {
              toast("Copy хийх боломжгүй байна");
            }
          });
      }

      function exportJson() {
        const data = JSON.stringify(getStore(), null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "3xtom-admin-data.json";
        link.click();
        URL.revokeObjectURL(url);
        toast("JSON татагдлаа");
      }

      renderApp();
    </script>
  </body>
</html>
